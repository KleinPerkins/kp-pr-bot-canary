name: controller

# Trusted, default-branch-only controller. Because it is triggered by workflow_run, GitHub
# always runs the copy of this file on the DEFAULT branch — never a PR's version — so a PR
# cannot alter the controller that would authorize it. It performs an entirely read-only,
# fail-closed preflight using the read-only GITHUB_TOKEN, and only after every assertion
# passes does it mint a narrowly-scoped App installation token to approve + enable native
# squash auto-merge. It never checks out, imports, or runs PR code or artifacts.
on:
  workflow_run:
    workflows: ["required"]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: controller-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorize-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only fail-closed preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          REQUIRED_CONTEXT="ci"
          REQUIRED_APP_ID=15368
          reject() { echo "PREFLIGHT REJECT: $*" >&2; exit 1; }

          # 1) Re-fetch the triggering run by id (never trust the event payload alone).
          run="$(gh api "repos/$THIS_REPO/actions/runs/$RUN_ID")"
          [ "$(echo "$run" | jq -r '.repository.full_name')" = "$THIS_REPO" ] || reject "run repo mismatch"
          [ "$(echo "$run" | jq -r '.path')" = ".github/workflows/required.yml" ] || reject "run workflow path unexpected"
          [ "$(echo "$run" | jq -r '.name')" = "required" ] || reject "run workflow name unexpected"
          [ "$(echo "$run" | jq -r '.event')" = "pull_request" ] || reject "run event not pull_request"
          [ "$(echo "$run" | jq -r '.status')" = "completed" ] || reject "run not completed"
          [ "$(echo "$run" | jq -r '.conclusion')" = "success" ] || reject "run conclusion not success"
          run_head="$(echo "$run" | jq -r '.head_sha')"

          # 2) Exactly one associated PR.
          pr_count="$(echo "$run" | jq '.pull_requests | length')"
          [ "$pr_count" = "1" ] || reject "expected exactly 1 associated PR, got $pr_count"
          pr_number="$(echo "$run" | jq -r '.pull_requests[0].number')"

          # 3) Re-fetch the PR; open / non-draft / same-repo / base allowlist.
          pr="$(gh api "repos/$THIS_REPO/pulls/$pr_number")"
          [ "$(echo "$pr" | jq -r '.state')" = "open" ] || reject "PR not open"
          [ "$(echo "$pr" | jq -r '.draft')" = "false" ] || reject "PR is draft"
          [ "$(echo "$pr" | jq -r '.base.ref')" = "main" ] || reject "PR base not allowlisted"
          [ "$(echo "$pr" | jq -r '.base.repo.full_name')" = "$THIS_REPO" ] || reject "base repo mismatch"
          [ "$(echo "$pr" | jq -r '.head.repo.full_name')" = "$THIS_REPO" ] || reject "head repo not same-repo (fork)"

          # 4) Author allowlist (login AND association).
          author="$(echo "$pr" | jq -r '.user.login')"
          assoc="$(echo "$pr" | jq -r '.author_association')"
          case " KleinPerkins " in *" $author "*) : ;; *) reject "author not allowlisted: $author" ;; esac
          [ "$assoc" = "OWNER" ] || reject "author association not allowlisted: $assoc"

          # 5) Current PR head == the run's associated head.
          pr_head="$(echo "$pr" | jq -r '.head.sha')"
          [ "$pr_head" = "$run_head" ] || reject "PR head moved since run ($pr_head != $run_head)"

          # 6) Required context is present, from Actions (15368), and LITERAL success on the head.
          #    (Required status checks accept success|skipped|neutral, so we demand literal success.)
          checks="$(gh api "repos/$THIS_REPO/commits/$pr_head/check-runs" --paginate --jq '.check_runs[]' | jq -s '.')"
          total="$(echo "$checks" | jq --arg n "$REQUIRED_CONTEXT" --argjson a "$REQUIRED_APP_ID" '[.[] | select(.name==$n and .app.id==$a)] | length')"
          [ "$total" -ge 1 ] || reject "required check '$REQUIRED_CONTEXT' from app $REQUIRED_APP_ID absent"
          ok="$(echo "$checks" | jq --arg n "$REQUIRED_CONTEXT" --argjson a "$REQUIRED_APP_ID" '[.[] | select(.name==$n and .app.id==$a and .conclusion=="success")] | length')"
          [ "$ok" -ge 1 ] || reject "required check '$REQUIRED_CONTEXT' not literal success"

          # 7) PR mergeable (GitHub computes this asynchronously; poll briefly).
          mergeable="null"
          for _ in 1 2 3 4 5 6; do
            mergeable="$(gh api "repos/$THIS_REPO/pulls/$pr_number" --jq '.mergeable')"
            [ "$mergeable" != "null" ] && break
            sleep 3
          done
          [ "$mergeable" = "true" ] || reject "PR not mergeable ($mergeable)"

          # 8) Exhaustively paginate changed files; reject if any touches a protected path.
          files="$(gh api "repos/$THIS_REPO/pulls/$pr_number/files" --paginate --jq '.[].filename')"
          echo "changed files:"; printf '%s\n' "$files" | sed 's/^/  /'
          protected=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/workflows/*|.github/actions/*|.github/scripts/*|.github/CODEOWNERS|.github/dependabot.yml)
                echo "  -> PROTECTED: $f"; protected=1 ;;
            esac
          done < <(printf '%s\n' "$files")
          [ "$protected" -eq 0 ] || reject "PR touches protected path(s); refusing to authorize"

          echo "preflight PASS: PR #$pr_number head $pr_head"
          {
            echo "pr_number=$pr_number"
            echo "head_sha=$pr_head"
          } >> "$GITHUB_OUTPUT"

      - name: Mint narrowly-scoped App installation token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Arm auto-merge, approve, and finalize squash merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          THIS_REPO: ${{ github.repository }}
          PR: ${{ steps.preflight.outputs.pr_number }}
          EXPECT: ${{ steps.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          abort() { echo "MUTATE ABORT: $*" >&2; exit 1; }

          # Re-fetch the head immediately before ANY mutation; abort if it moved.
          h1="$(gh api "repos/$THIS_REPO/pulls/$PR" --jq '.head.sha')"
          [ "$h1" = "$EXPECT" ] || abort "head moved before mutation ($h1)"
          pr_id="$(gh api "repos/$THIS_REPO/pulls/$PR" --jq '.node_id')"

          # 1) Arm native squash auto-merge FIRST, pinned to the exact head via expectedHeadOid.
          #    This controller is triggered by workflow_run AFTER required CI is already green, so the
          #    bot approval in step 2 is the LAST unmet gate; arming while the PR is still blocked on
          #    that approval is accepted by GitHub. If a prior bot approval already made the PR
          #    mergeable (e.g. a re-run), enablePullRequestAutoMerge returns UNPROCESSABLE "clean
          #    status" and we fall back to a direct pinned squash merge in step 4. Any other error is
          #    fatal (fail closed).
          armed=0
          set +e
          out="$(gh api graphql \
            -f query='mutation($id:ID!,$oid:GitObjectID!){ enablePullRequestAutoMerge(input:{pullRequestId:$id, mergeMethod:SQUASH, expectedHeadOid:$oid}){ pullRequest{ number } } }' \
            -f id="$pr_id" -f oid="$EXPECT" 2>&1)"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            armed=1
            echo "native squash auto-merge armed for #$PR @ $EXPECT"
          elif printf '%s' "$out" | grep -q "clean status"; then
            echo "auto-merge not armed (PR already in clean status); will direct-merge after approval"
          else
            abort "enablePullRequestAutoMerge failed unexpectedly: $out"
          fi

          # 2) Approve, pinned to the exact head — only if no current bot approval already exists.
          reviews="$(gh api "repos/$THIS_REPO/pulls/$PR/reviews" --paginate --jq '.[]' | jq -s '.')"
          existing="$(echo "$reviews" | jq --arg h "$EXPECT" '[.[] | select(.state=="APPROVED" and .commit_id==$h and .user.type=="Bot")] | length')"
          if [ "${existing:-0}" -ge 1 ]; then
            echo "existing bot approval for $EXPECT present; not re-approving"
          else
            gh api --method POST "repos/$THIS_REPO/pulls/$PR/reviews" \
              -f event=APPROVE -f commit_id="$EXPECT" \
              -f body="Automated review-bot approval: read-only preflight passed for $EXPECT." \
              --jq '"approved " + .commit_id'
          fi

          # 3) Re-fetch head; stop if it moved after approving.
          h2="$(gh api "repos/$THIS_REPO/pulls/$PR" --jq '.head.sha')"
          [ "$h2" = "$EXPECT" ] || abort "head moved after approval ($h2); not finalizing"

          # 4) Finalize. Armed path: the fresh approval satisfies the last gate, so native auto-merge
          #    fires; poll briefly for completion. Clean-status path: perform a direct squash merge
          #    pinned to the exact head (?sha= fails if the head moved — same race-safety as
          #    expectedHeadOid). These two paths are mutually exclusive (no double-merge race).
          if [ "$armed" = "1" ]; then
            merged="false"
            for _ in $(seq 1 20); do
              merged="$(gh api "repos/$THIS_REPO/pulls/$PR" --jq '.merged')"
              [ "$merged" = "true" ] && break
              sleep 3
            done
            [ "$merged" = "true" ] || abort "auto-merge armed but PR #$PR did not merge in time"
          else
            gh api --method PUT "repos/$THIS_REPO/pulls/$PR/merge" \
              -f merge_method=squash -f sha="$EXPECT" \
              --jq '"direct squash merge " + .sha + " merged=" + (.merged|tostring)'
          fi

          # 5) Verify the PR is actually merged (deterministic, fully green).
          merged="$(gh api "repos/$THIS_REPO/pulls/$PR" --jq '.merged')"
          [ "$merged" = "true" ] || abort "PR #$PR not merged after finalize"
          echo "controller: PR #$PR squash-merged (pinned $EXPECT)"
