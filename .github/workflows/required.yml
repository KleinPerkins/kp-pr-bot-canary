name: required

# Unprivileged CI producer. Runs untrusted PR head code, so it holds NO secrets
# and only read access. Every "uses:" is pinned to a full 40-char commit SHA.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate repository structure
        run: |
          set -euo pipefail
          test -f README.md
          echo "structure: README.md present"

  validate-content:
    # CANARY D: this workflow only triggers on pull_request, so this condition is always
    # false at runtime -> the job is SKIPPED, and the aggregator must fail closed on it.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate content
        run: |
          set -euo pipefail
          if [ -e "FAIL-CI-CANARY" ]; then
            echo "content: FAIL-CI-CANARY marker file present -> failing this job"
            exit 1
          fi
          echo "content: no failure marker file"

  # Aggregator: this is the SINGLE required status context for the branch.
  ci:
    if: always()
    needs: [validate-structure, validate-content]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required results (fail closed)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "needs context = $NEEDS_JSON"
          count="$(printf '%s' "$NEEDS_JSON" | jq 'length')"
          echo "discovered validation targets: $count"
          if [ "$count" -eq 0 ]; then
            echo "FAIL CLOSED: zero validation targets were discovered"
            exit 1
          fi
          nonsuccess="$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')"
          if [ -n "$nonsuccess" ]; then
            echo "FAIL CLOSED: non-success upstream result(s):"
            printf '  %s\n' "$nonsuccess"
            exit 1
          fi
          echo "PASS: all $count validation target(s) reported success"
