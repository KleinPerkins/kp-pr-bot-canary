name: required

# Unprivileged CI producer. Runs untrusted PR head code, so it holds NO secrets
# and only read access. Every "uses:" is pinned to a full 40-char commit SHA.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate repository structure
        run: |
          set -euo pipefail
          test -f README.md
          echo "structure: README.md present"

  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate content
        run: |
          set -euo pipefail
          if [ -e "FAIL-CI-CANARY" ]; then
            echo "content: FAIL-CI-CANARY marker file present -> failing this job"
            exit 1
          fi
          echo "content: no failure marker file"

  # CANARY C/E: the aggregator job is renamed so the required context "ci" NEVER reports.
  # The required check is therefore ABSENT, which must keep the PR unmergeable, and a
  # same-named status posted from a non-15368 source must not satisfy the rule.
  aggregator-renamed-canary:
    if: always()
    needs: [validate-structure, validate-content]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required results (fail closed)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "needs context = $NEEDS_JSON"
          echo "NOTE: this job is intentionally NOT named 'ci' for the absent-check canary"
